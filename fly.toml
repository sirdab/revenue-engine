# Example Fly.io config. See DEPLOY.md and
# https://fly.io/docs/reference/configuration/. Set `app` to your own app name
# (or pass --app to flyctl) and pick a region close to your database.

app = 'my-crm'
primary_region = 'fra'

# Applies the committed migrations from the new image, in a one-off machine
# with the app's secrets, before any machine is updated. A failed migration
# stops the deploy. Safe to run every time (already-applied ones are skipped).
[deploy]
  release_command = 'node dist/migrate.mjs'

[build]
  dockerfile = 'Dockerfile'

  [build.args]
    BASE_PATH = '/'
    PORT = '8080'
    VITE_SENTRY_DSN = ''

[env]
  NODE_ENV = 'production'
  PORT = '8080'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

  [http_service.concurrency]
    type = 'requests'
    hard_limit = 250
    soft_limit = 200

  [[http_service.checks]]
    interval = '15s'
    timeout = '2s'
    grace_period = '10s'
    method = 'GET'
    path = '/api/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '2gb'
  cpus = 2
  memory_mb = 2048
