          type: string
        pipelineId:
          type: integer
        stageId:
          type: integer
        ownerId:
          type: integer
        personId:
          type: integer
        organizationId:
          type: integer
        # Inline contact creation. When personId is absent but personPhone is
        # set, the deal importer links an existing contact with that phone (the
        # most recently created one if several match) or creates a new contact
        # from personPhone/personName/personEmail and links it. personName is
