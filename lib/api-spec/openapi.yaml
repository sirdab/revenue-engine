openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: Revenue Engine API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: Authentication and sign-up
  - name: workspace
    description: The current tenant workspace
  - name: pipelines
    description: Pipelines and board
  - name: stages
    description: Pipeline stages
  - name: deals
    description: Deals
  - name: views
    description: Saved deal views
  - name: user-preferences
    description: Per-user default/working-state preferences
  - name: persons
    description: People (contacts)
  - name: organizations
    description: Organizations
  - name: activities
    description: Activities
  - name: notes
    description: Notes
  - name: users
    description: Users (admin)
  - name: search
    description: Global search
  - name: labels
    description: Label registry and managed lost reasons
  - name: assignment-rules
    description: Auto-assignment rules engine (admin)
  - name: insights
    description: Self-serve analytics dashboards and widget queries
paths:
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"

  /auth/login:
    post:
      operationId: login
      tags: [auth]
      summary: Sign in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/signup:
    post:
      operationId: signup
      tags: [auth]
      summary: Create a new workspace and its first admin, then sign in
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SignupInput"
      responses:
        "201":
          description: Workspace created; the new admin is signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "400":
          description: Invalid input or weak password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /workspace:
    get:
      operationId: getWorkspace
      tags: [workspace]
      summary: The signed-in user's workspace
      responses:
        "200":
          description: Workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
    patch:
      operationId: updateWorkspace
      tags: [workspace]
      summary: Rename the workspace (admin)
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WorkspaceUpdate"
      responses:
        "200":
          description: Updated workspace
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Workspace"
        "403":
          description: Admin access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/logout:
    post:
      operationId: logout
      tags: [auth]
      summary: Sign out the current user
      responses:
        "204":
          description: Signed out

  /auth/me:
    get:
      operationId: getCurrentUser
      tags: [auth]
      summary: Get the currently authenticated user
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Not authenticated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/forgot-password:
    post:
      operationId: forgotPassword
      tags: [auth]
      summary: Request a password reset email
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ForgotPasswordInput"
      responses:
        "200":
          description: Generic acknowledgement (never reveals whether the email exists)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"

  /auth/reset-password:
    post:
      operationId: resetPassword
      tags: [auth]
      summary: Set a new password using a reset token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ResetPasswordInput"
      responses:
        "200":
          description: Password updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MessageResponse"
        "400":
          description: Invalid or expired token, or weak password
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /auth/reset-password/validate:
    get:
      operationId: validateResetToken
      tags: [auth]
      summary: Check whether a password reset token is still valid
      parameters:
        - name: token
          in: query
          required: true
          schema:
            type: string
      responses:
        "200":
          description: Validity of the token
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResetTokenValidity"

  /pipelines:
    get:
      operationId: listPipelines
      tags: [pipelines]
      summary: List pipelines
      responses:
        "200":
          description: Pipelines
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Pipeline"

  /board:
    get:
      operationId: getBoard
      tags: [pipelines]
      summary: Get a pipeline's kanban board with stages and deals
      parameters:
        - name: pipelineId
          in: query
          required: true
          schema:
            type: integer
        - name: ownerId
          in: query
          required: false
          schema:
            type: integer
        - name: q
          in: query
          required: false
          schema:
            type: string
        - name: filters
          in: query
          required: false
          description: base64url-encoded JSON filter group (AND/OR DSL), the same one the deals list takes
          schema:
            type: string
      responses:
        "200":
          description: Board
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Board"
        "404":
          description: Pipeline not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /stages:
    get:
      operationId: listStages
      tags: [stages]
      summary: List stages, optionally filtered by pipeline
      parameters:
        - name: pipelineId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Stages
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Stage"

  /deals:
    get:
      operationId: listDeals
      tags: [deals]
      summary: List deals with optional filters
      parameters:
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [pipeline, list, forecast]
        - name: pipelineId
          in: query
          required: false
          schema:
            type: integer
        - name: stageId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: >
            Status lens. Omitted defaults to open-only in the working views.
            `all` drops the status filter entirely (archived deals are still
            excluded unless the `archived` lens is on).
          schema:
            type: string
            enum: [open, won, lost, deleted, all]
        - name: ownerId
          in: query
          required: false
          schema:
            type: integer
        - name: personId
          in: query
          required: false
          schema:
            type: integer
        - name: organizationId
          in: query
          required: false
          schema:
            type: integer
        - name: q
          in: query
          required: false
          description: Free-text search across deal title, contact name/email/phone, and organization name.
          schema:
            type: string
        - name: archived
          in: query
          required: false
          description: true = only archived deals; omitted/false = archived excluded.
          schema:
            type: boolean
        - name: rotting
          in: query
          required: false
          description: true = only rotting deals (open, idle past the stage's rotting threshold). Omitted/false = no rotting filter.
          schema:
            type: boolean
        - name: filters
          in: query
          required: false
          description: base64url-encoded JSON filter group (AND/OR DSL)
          schema:
            type: string
        - name: sort
          in: query
          required: false
          description: "Sort spec as field:direction, e.g. value:desc. Allowed fields: title, value, addTime, wonTime, stageChangeTime, stage, organization, owner, status, utmKeyword."
          schema:
            type: string
        - name: page
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 200
        - name: columns
          in: query
          required: false
          description: Comma-separated list of visible column keys (hint only).
          schema:
            type: string
      responses:
        "200":
          description: Deals
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealList"
    post:
      operationId: createDeal
      tags: [deals]
      summary: Create a deal
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deals/{id}:
    get:
      operationId: getDeal
      tags: [deals]
      summary: Get a deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deal
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updateDeal
      tags: [deals]
      summary: Update a deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Deal"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDeal
      tags: [deals]
      summary: Delete a deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deals/count:
    get:
      operationId: countDeals
      tags: [deals]
      summary: Count deals matching filters
      parameters:
        - name: view
          in: query
          required: false
          schema:
            type: string
            enum: [pipeline, list, forecast]
        - name: pipelineId
          in: query
          required: false
          schema:
            type: integer
        - name: stageId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          description: >
            Status lens. Omitted defaults to open-only in the working views.
            `all` drops the status filter entirely (archived deals are still
            excluded unless the `archived` lens is on).
          schema:
            type: string
            enum: [open, won, lost, deleted, all]
        - name: ownerId
          in: query
          required: false
          schema:
            type: integer
        - name: personId
          in: query
          required: false
          schema:
            type: integer
        - name: organizationId
          in: query
          required: false
          schema:
            type: integer
        - name: q
          in: query
          required: false
          description: Free-text search across deal title, contact name/email/phone, and organization name.
          schema:
            type: string
        - name: archived
          in: query
          required: false
          description: true = only archived deals; omitted/false = archived excluded.
          schema:
            type: boolean
        - name: rotting
          in: query
          required: false
          description: true = only rotting deals (open, idle past the stage's rotting threshold). Omitted/false = no rotting filter.
          schema:
            type: boolean
        - name: filters
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Deal count
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealCount"

  /deals/forecast:
    get:
      operationId: forecastDeals
      tags: [deals]
      summary: Forecast deals grouped by expected close month (workspace time zone)
      parameters:
        - name: pipelineId
          in: query
          required: false
          schema:
            type: integer
        - name: ownerId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, won, lost, deleted]
        - name: filters
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: Forecast buckets
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealForecast"

  /deals/stage-summary:
    get:
      operationId: getDealStageSummary
      tags: [deals]
      summary: Per-stage open-deal count and value for one pipeline
      parameters:
        - name: pipelineId
          in: query
          required: true
          schema:
            type: integer
        - name: ownerId
          in: query
          required: false
          schema:
            type: integer
        - name: status
          in: query
          required: false
          schema:
            type: string
            enum: [open, won, lost, deleted]
      responses:
        "200":
          description: Stage summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealStageSummary"

  /deals/labels:
    get:
      operationId: listDealLabels
      tags: [deals]
      summary: Distinct labels in use across all deals
      responses:
        "200":
          description: Sorted list of distinct label names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /deals/owners:
    get:
      operationId: listDealOwners
      tags: [deals]
      summary: Distinct owners that have at least one (non-deleted) deal
      responses:
        "200":
          description: Owners that currently have deals
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DealOwner"

  /deals/{id}/merge:
    post:
      operationId: mergeDeal
      tags: [deals]
      summary: Merge this (duplicate) deal into another deal
      description: >
        Moves the duplicate's activities, notes, files and audit history to
        the primary, fills the primary's empty fields from the duplicate,
        unions labels, then archives the duplicate with a pointer to the
        survivor. Pass preview=true to see what would happen without changing
        anything.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealMergeInput"
      responses:
        "200":
          description: Merge result (or preview)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealMergeResult"
        "404":
          description: Deal not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: One of the deals cannot be merged (archived, deleted, or already merged)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deals/bulk:
    post:
      operationId: bulkUpdateDeals
      tags: [deals]
      summary: Bulk update or delete deals
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealBulkInput"
      responses:
        "200":
          description: Bulk result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealBulkResult"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deals/{id}/history:
    get:
      operationId: getDealHistory
      tags: [deals]
      summary: Change history and time-in-stage for a deal
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Deal history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealHistory"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /changes/feed:
    get:
      operationId: getChangesFeed
      tags: [changes]
      summary: Recent changes made by others on records the current user owns
      parameters:
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 50
      responses:
        "200":
          description: Changes feed, newest first
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChangesFeed"

  /funnel:
    get:
      operationId: getPipelineFunnel
      tags: [pipelines]
      summary: Stage conversion funnel and average time-in-stage for a pipeline
      parameters:
        - name: pipelineId
          in: query
          required: true
          schema:
            type: integer
        - name: from
          in: query
          required: false
          description: Inclusive start date (YYYY-MM-DD, workspace time zone) scoping deal entry
          schema:
            type: string
        - name: to
          in: query
          required: false
          description: Inclusive end date (YYYY-MM-DD, workspace time zone) scoping deal entry
          schema:
            type: string
        - name: ownerId
          in: query
          required: false
          schema:
            type: integer
      responses:
        "200":
          description: Pipeline funnel
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PipelineFunnel"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deal-views:
    get:
      operationId: listDealViews
      tags: [views]
      summary: List saved views for the current user
      responses:
        "200":
          description: Views
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/DealView"
    post:
      operationId: createDealView
      tags: [views]
      summary: Create a saved view
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealViewInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealView"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /deal-views/{id}:
    patch:
      operationId: updateDealView
      tags: [views]
      summary: Update a saved view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DealViewUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DealView"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteDealView
      tags: [views]
      summary: Delete a saved view
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /user-preferences:
    get:
      operationId: getUserPreferences
      tags: [user-preferences]
      summary: Get the current user's preferences document
      responses:
        "200":
          description: Preferences (an empty object if the user has none saved yet)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    patch:
      operationId: updateUserPreferences
      tags: [user-preferences]
      summary: Deep-merge a partial patch into the current user's preferences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserPreferencesPatch"
      responses:
        "200":
          description: The updated preferences document
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserPreferences"
    delete:
      operationId: resetUserPreferences
      tags: [user-preferences]
      summary: Reset the current user's preferences document back to empty
      responses:
        "204":
          description: Reset

  /persons:
    get:
      operationId: listPersons
      tags: [persons]
      summary: List people
      parameters:
        - name: q
          in: query
          required: false
          schema:
            type: string
      responses:
        "200":
          description: People
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Person"
    post:
      operationId: createPerson
      tags: [persons]
      summary: Create a person
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /persons/{id}:
    get:
      operationId: getPerson
      tags: [persons]
      summary: Get a person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Person
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    patch:
      operationId: updatePerson
      tags: [persons]
      summary: Update a person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PersonUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Person"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deletePerson
      tags: [persons]
      summary: Delete a person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /persons/{id}/history:
    get:
      operationId: getPersonHistory
      tags: [persons]
      summary: Change history for a person
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: Person history
          content:
