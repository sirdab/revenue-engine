  # ---- Insights (self-serve analytics) ------------------------------------
  /insights/dashboards:
    get:
      operationId: listInsightsDashboards
      tags: [insights]
      summary: List dashboards visible to the current user (own + shared)
      responses:
        "200":
          description: Dashboards with their widgets
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/InsightsDashboard"
    post:
      operationId: createInsightsDashboard
      tags: [insights]
      summary: Create a dashboard
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsDashboardInput"
      responses:
        "201":
          description: Created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsDashboard"
        "400":
          description: Invalid input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /insights/dashboards/{id}:
    patch:
      operationId: updateInsightsDashboard
      tags: [insights]
      summary: Update a dashboard (name, section, layout, board filters, share)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsDashboardUpdate"
      responses:
        "200":
          description: Updated
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsDashboard"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: >
            Stale write rejected: `expectedUpdatedAt` was sent and no longer
            matches (the dashboard changed elsewhere). Reload and retry.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
    delete:
      operationId: deleteInsightsDashboard
      tags: [insights]
      summary: Delete a dashboard (widgets cascade; library widgets survive)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "204":
          description: Deleted
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /insights/dashboards/{id}/duplicate:
    post:
      operationId: duplicateInsightsDashboard
      tags: [insights]
      summary: Duplicate a dashboard (widgets and layout copied, owned by caller)
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsDuplicateDashboardInput"
      responses:
        "201":
          description: The new dashboard
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsDashboard"
        "404":
          description: Not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

