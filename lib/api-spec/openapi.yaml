    get:
      operationId: listNotificationRules
      tags: [notifications]
      summary: Notification rules an admin has authored, with my subscription state
      description: >
        Every active automation whose action posts an in-app notification, each
        merged with the CURRENT user's subscription so the settings page renders
        from one call. Readable by any authenticated user — authoring stays on
        the admin automations endpoints.
      responses:
        "200":
          description: Rules with my subscription state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRulesResponse"

  /notification-rules/automations:
    put:
      operationId: setAutomationNotifications
      tags: [notifications]
      summary: One on/off for every automation that posts an in-app notification
      description: >
        Subscribes or unsubscribes the CURRENT user to every active
        notification-posting automation at once.

        This replaces the per-rule subscription list. That list was the single
        worst piece of this feature's design: creating a rule in Settings looked
        like finishing, and a second identical-looking toggle on a different page
        was what actually made it deliver — with nothing on the first page saying
        so. One switch, and the lead time belongs to the automation rather than to
        each subscriber.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AutomationNotificationsInput"
      responses:
        "200":
          description: New state
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AutomationNotificationsState"

  /notification-rules/{id}/subscription:
    put:
      operationId: setNotificationSubscription
      tags: [notifications]
      summary: Subscribe, unsubscribe, or retune one rule for the current user
      description: >
        Idempotent upsert keyed on (current user, rule) — calling it twice is the
        same as calling it once. The recipient is always the session user; there
        is no way to set a subscription for someone else. Setting active=false
        keeps the row so the user's tuning survives being switched off.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NotificationSubscriptionInput"
      responses:
        "200":
          description: The saved subscription state for this rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/NotificationRule"
        "400":
          description: Params rejected — an unknown key, or one the rule does not declare tunable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: No such notification rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

