    post:
      operationId: createInsightsStarterDashboard
      tags: [insights]
      summary: Seed the starter dashboard (one transaction, server-owned content)
      description: >
        Creates the example "Overview" board — dashboard, widgets and packed
        layout land atomically, so a failure never strands a half-built board.
      responses:
        "201":
          description: The seeded dashboard with its widgets
          content:
