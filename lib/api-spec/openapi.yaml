        members:
          type: array
          items:
            $ref: "#/components/schemas/TeamMember"

    TeamInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120

    TeamUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        active:
          type: boolean
        orderIndex:
          type: integer

    AdminTeamList:
      type: object
      required: [teams]
      properties:
        teams:
          type: array
          items:
            $ref: "#/components/schemas/Team"

    AssignmentRuleCondition:
      type: object
      description: A single field/operator/value leaf of the conditions tree.
      required: [field, operator]
      properties:
        field:
          type: string
        operator:
          type: string
        value:
          description: >
            Scalar (string/number/boolean/null) or a two-element array for
            range operators; absent for presence operators. The server
            re-validates the whole tree with the shared deals-filter schema.
      additionalProperties: false

    AssignmentRuleConditionGroup:
      type: object
      description: The FilterGroup DSL — a combinator over conditions and nested groups.
      required: [combinator, conditions]
      properties:
        combinator:
          type: string
          enum: [and, or]
        conditions:
          type: array
          items:
            oneOf:
              - $ref: "#/components/schemas/AssignmentRuleCondition"
              - $ref: "#/components/schemas/AssignmentRuleConditionGroup"

    AssignmentRule:
      type: object
      required:
        [
          id,
          name,
          triggerEvent,
          conditions,
          targetTeamId,
          targetTeamName,
          targetAssigneeId,
          targetAssigneeName,
          takeoverOwned,
          priority,
          active,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        conditions:
          $ref: "#/components/schemas/AssignmentRuleConditionGroup"
        targetTeamId:
          type: ["integer", "null"]
        targetTeamName:
          type: ["string", "null"]
        targetAssigneeId:
          type: ["integer", "null"]
          description: null means round-robin across the target team's active members.
        targetAssigneeName:
          type: ["string", "null"]
        takeoverOwned:
          type: boolean
          description: >
            Deal-updated rules only — when true this rule may reassign a deal
            that already has an owner (still only on a real pipeline/stage
            change, never when the request sets the owner itself).
        priority:
          type: integer
        active:
          type: boolean

    AssignmentRuleInput:
      type: object
      required: [name, triggerEvent, conditions, targetTeamId]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        conditions:
          $ref: "#/components/schemas/AssignmentRuleConditionGroup"
        targetTeamId:
          type: integer
        targetAssigneeId:
          type: ["integer", "null"]
        takeoverOwned:
          type: boolean

    AssignmentRuleUpdate:
      type: object
      description: All fields optional; only supplied fields are changed.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        conditions:
          $ref: "#/components/schemas/AssignmentRuleConditionGroup"
        targetTeamId:
          type: integer
        targetAssigneeId:
          type: ["integer", "null"]
        takeoverOwned:
          type: boolean
        active:
          type: boolean

    AssignmentRuleReorder:
      type: object
      required: [triggerEvent, orderedIds]
      properties:
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        orderedIds:
          type: array
          items:
            type: integer

    AdminAssignmentRuleList:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/AssignmentRule"

    AutomationAssignee:
      type: object
      description: >
        Who receives the automation's output. kind=deal_owner uses the deal's
        owner; kind=user targets userId; kind=auto (create_deal owner only)
        leaves the new deal to the deal_added assignment rules.
      required: [kind]
      properties:
        kind:
          type: string
          enum: [deal_owner, user, auto]
        userId:
          type: integer
      additionalProperties: false

    AutomationActionConfig:
      type: object
      description: >
        Shape is discriminated by the automation's actionType — create_activity
        uses subject/activityType/dueInDays/assignee; create_deal uses
        pipelineId/stageId/titleTemplate/owner; call_webhook uses
        url/method/includeDeal/secretHeaderName. The server re-validates the
        config strictly against the actionType at write time (same loose-here,
        strict-there pattern as assignment-rule conditions).
      properties:
        subject:
          type: string
        activityType:
          type: string
          enum: [call, meeting, email, task, deadline, whatsapp]
        dueInDays:
          type: integer
          minimum: 0
        assignee:
          $ref: "#/components/schemas/AutomationAssignee"
        pipelineId:
          type: integer
        stageId:
          type: ["integer", "null"]
          description: null = first live stage of the pipeline.
        titleTemplate:
          type: ["string", "null"]
          description: null/empty copies the source title; "{title}" interpolates it.
        owner:
          $ref: "#/components/schemas/AutomationAssignee"
        url:
          type: string
          description: call_webhook — outbound https URL.
        method:
          type: string
          enum: [POST, PUT]
        includeDeal:
          type: boolean
          description: call_webhook — include the deal row in the payload.
        secretHeaderName:
          type: ["string", "null"]
          description: >
            call_webhook — header to send the integration webhook secret under;
            null = no auth header.
        destination:
          $ref: "#/components/schemas/SlackDestination"
          description: send_slack_message — where the message goes.
        message:
          type: string
          description: >
            send_slack_message and post_notification — body, with {{deal.*}}
            placeholders interpolated at run time.
            post_notification also resolves {{params.*}} per subscriber.
        tunable:
          description: >
            post_notification — knobs each subscriber may override on their own
            subscription. Absent/empty = every subscriber gets the rule
            identically.
          type: array
          items:
            type: string
            enum: [days]

    SlackDestination:
      type: object
      description: >
        send_slack_message destination, discriminated by `kind`: channel
        (channel name/id, blank = the webhook's fixed channel), deal_owner (DM
        the triggering deal's owner), or user (DM a specific CRM user).
      properties:
        kind:
          type: string
          enum: [channel, deal_owner, user]
        channel:
          type: string
        userId:
          type: integer
      required: [kind]

    Automation:
      type: object
      required:
        [
          id,
          name,
          triggerEvent,
          conditions,
          actionType,
          actionConfig,
          priority,
          active,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        conditions:
          $ref: "#/components/schemas/AssignmentRuleConditionGroup"
        actionType:
          type: string
          enum:
            [create_activity, create_deal, call_webhook, send_slack_message, post_notification]
        actionConfig:
          $ref: "#/components/schemas/AutomationActionConfig"
        priority:
          type: integer
        active:
          type: boolean

    AutomationInput:
      type: object
      required: [name, triggerEvent, conditions, actionType, actionConfig]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        conditions:
          $ref: "#/components/schemas/AssignmentRuleConditionGroup"
        actionType:
          type: string
          enum:
            [create_activity, create_deal, call_webhook, send_slack_message, post_notification]
        actionConfig:
          $ref: "#/components/schemas/AutomationActionConfig"

    AutomationUpdate:
      type: object
      description: >
        All fields optional; only supplied fields are changed. actionType and
        actionConfig must be supplied together when the type changes.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        conditions:
          $ref: "#/components/schemas/AssignmentRuleConditionGroup"
        actionType:
          type: string
          enum:
            [create_activity, create_deal, call_webhook, send_slack_message, post_notification]
        actionConfig:
          $ref: "#/components/schemas/AutomationActionConfig"
        active:
          type: boolean

    AutomationReorder:
      type: object
      required: [triggerEvent, orderedIds]
      properties:
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        orderedIds:
          type: array
          items:
            type: integer

    AdminAutomationList:
      type: object
      required: [automations]
      properties:
        automations:
          type: array
          items:
            $ref: "#/components/schemas/Automation"

    AutomationTemplate:
      type: object
      description: >
        A saved, org-wide automation template. Prefills the wizard with the
        same conditions/action shape as a real automation.
      required:
        [id, name, description, triggerEvent, conditions, actionType, actionConfig]
      properties:
        id:
          type: integer
        name:
          type: string
        description:
          type: string
        emoji:
          type: ["string", "null"]
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        conditions:
          $ref: "#/components/schemas/AssignmentRuleConditionGroup"
        actionType:
          type: string
          enum:
            [create_activity, create_deal, call_webhook, send_slack_message, post_notification]
        actionConfig:
          $ref: "#/components/schemas/AutomationActionConfig"
        createdByName:
          type: ["string", "null"]
          description: Display name of whoever saved it (null if that user is gone).

    AutomationTemplateInput:
      type: object
      required: [name, triggerEvent, conditions, actionType, actionConfig]
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        description:
          type: string
          maxLength: 300
        emoji:
          type: ["string", "null"]
          maxLength: 8
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        conditions:
          $ref: "#/components/schemas/AssignmentRuleConditionGroup"
        actionType:
          type: string
          enum:
            [create_activity, create_deal, call_webhook, send_slack_message, post_notification]
        actionConfig:
          $ref: "#/components/schemas/AutomationActionConfig"

    AutomationTemplateList:
      type: object
      required: [templates]
      properties:
        templates:
          type: array
          items:
            $ref: "#/components/schemas/AutomationTemplate"

    SlackChannel:
      type: object
      required: [id, name, isPrivate, isMember]
      properties:
        id:
          type: string
        name:
          type: string
        isPrivate:
          type: boolean
        isMember:
          type: boolean

    SlackChannelList:
      type: object
      required: [available, channels]
      properties:
        available:
          type: boolean
          description: >
            false when the bot token lacks the channels:read scope or Slack is
            unreachable — the wizard then falls back to a free-text field.
        channels:
          type: array
          items:
            $ref: "#/components/schemas/SlackChannel"

    MessageChip:
      type: object
      description: >
        One clickable field button in the wizard's message editor. `insert` is
        what clicking adds to the message — either a data placeholder like
        {{deal.title}} (validated against the server whitelist) or a plain
        text snippet (e.g. an emoji phrase).
      required: [insert, label]
      properties:
        insert:
          type: string
          minLength: 1
          maxLength: 120
        label:
          type: string
          minLength: 1
          maxLength: 40
        labelAr:
          type: string
          maxLength: 40

    MessageChipConfig:
      type: object
      required: [deal]
      properties:
        deal:
          type: array
          maxItems: 20
          items:
            $ref: "#/components/schemas/MessageChip"

    TestAutomationInput:
      type: object
      required: [triggerEvent, actionType, actionConfig]
      properties:
        triggerEvent:
          type: string
          enum: [deal_added, deal_updated]
        actionType:
          type: string
          enum:
            [create_activity, create_deal, call_webhook, send_slack_message, post_notification]
        actionConfig:
          $ref: "#/components/schemas/AutomationActionConfig"

    TestAutomationResult:
      type: object
      required: [delivered, detail]
      properties:
        delivered:
          type: boolean
        detail:
          type: string
          description: Human-readable outcome, shown in the wizard toast.
    # ---- Insights (self-serve analytics) -----------------------------------
    # The widget query spec's canonical validation lives in
    # @workspace/insights-spec (Zod); the API re-validates `spec` there before
    # persisting or executing, like deal-views does for `definition`. The
    # OpenAPI shape below types the envelope and leaves deep spec/viz payloads
    # open so the spec lib stays the single source of truth.
    InsightsWidgetSpec:
      type: object
      description: >
        Widget query spec (version, scope, reportType, measure, viewBy,
        segmentBy, filters, dateBasis, options, limit, sort). Validated
        server-side against @workspace/insights-spec.
      required: [version, scope, reportType, measure, filters]
      properties:
        version:
          type: integer
        scope:
          type: string
          enum:
            [
              deals,
              activities,
              organizations,
            ]
        reportType:
          type: string
          enum:
            [
              performance,
              conversionFunnel,
              conversionWinLoss,
              duration,
              progress,
              timeToFirstActivity,
              table,
              pivot,
            ]
        measure:
          type: object
          required: [field, agg]
          properties:
            field:
              type: string
            agg:
              type: string
              enum: [count, sum, avg, median, p25, p75, min, max]
        viewBy:
          type: object
          required: [field]
          properties:
            field:
              type: string
            dateBucket:
              type: string
              enum: [day, week, month, quarter]
        segmentBy:
          type: object
          required: [field]
          properties:
            field:
              type: string
        filters:
          description: Graph-level filter group (extended deals-filter DSL).
          type: object
          additionalProperties: true
        dateBasis:
          type: string
          enum:
            [
              createdAt,
              closedAt,
              wonAt,
              lostAt,
              enteredStageAt,
              activityDoneAt,
            ]
        options:
          type: object
          additionalProperties: true
        limit:
          type: integer
        sort:
          type: object
          required: [field, direction]
          properties:
            field:
              type: string
            direction:
              type: string
              enum: [asc, desc]

    InsightsWidgetViz:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum:
            [
              bar,
              horizontalBar,
              line,
              area,
              pie,
              funnel,
              waterfall,
              gauge,
              singleNumber,
              table,
              pivot,
            ]
        options:
          type: object
          additionalProperties: true

    InsightsLayoutItem:
      type: object
      description: react-grid-layout style placement, keyed by widget id.
      required: [i, x, y, w, h]
      properties:
        i:
          type: string
        x:
          type: integer
        y:
          type: integer
        w:
          type: integer
        h:
          type: integer

    InsightsGlobalFilters:
      type: object
      description: >
        Board-level filter state. Composes with each widget's own filters by
        intersection server-side. `filters` carries the Add-filter condition
        group, base64url-encoded with the shared deals-filter codec.
      properties:
        dateRange:
          type: object
          properties:
            preset:
              type: string
            from:
              type: string
              format: date
            to:
              type: string
              format: date
            basis:
              type: string
              enum:
                [
                  createdAt,
                  closedAt,
                  wonAt,
                  lostAt,
                  enteredStageAt,
                  activityDoneAt,
                ]
        ownerIds:
          type: array
          items:
            type: integer
        pipelineIds:
          type: array
          items:
            type: integer
        statuses:
          type: array
          items:
            type: string
            enum: [open, won, lost]
        qualification:
          type: string
          enum: [qualified, unqualified]
        filters:
          type: ["string", "null"]

    InsightsWidget:
      type: object
      required: [id, dashboardId, name, spec, viz, createdAt, updatedAt]
      properties:
        id:
          type: integer
        dashboardId:
          type: ["integer", "null"]
        name:
          type: string
        spec:
          $ref: "#/components/schemas/InsightsWidgetSpec"
        viz:
          $ref: "#/components/schemas/InsightsWidgetViz"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InsightsWidgetInput:
      type: object
      required: [name, spec, viz]
      properties:
        dashboardId:
          type: ["integer", "null"]
        name:
          type: string
          minLength: 1
        spec:
          $ref: "#/components/schemas/InsightsWidgetSpec"
        viz:
          $ref: "#/components/schemas/InsightsWidgetViz"

    InsightsWidgetUpdate:
      type: object
      properties:
        dashboardId:
          type: ["integer", "null"]
        name:
          type: string
          minLength: 1
        spec:
          $ref: "#/components/schemas/InsightsWidgetSpec"
        viz:
          $ref: "#/components/schemas/InsightsWidgetViz"

    InsightsDashboard:
      type: object
      required:
        [
          id,
          name,
          ownerId,
          isShared,
          sharedUserIds,
          layout,
          isDefault,
          widgets,
          createdAt,
          updatedAt,
        ]
      properties:
        id:
          type: integer
        name:
          type: string
        section:
          type: ["string", "null"]
        ownerId:
          type: integer
        isShared:
          type: boolean
        sharedUserIds:
          type: array
          items:
            type: integer
        globalFilters:
          oneOf:
            - $ref: "#/components/schemas/InsightsGlobalFilters"
            - type: "null"
        layout:
          type: array
          items:
            $ref: "#/components/schemas/InsightsLayoutItem"
        isDefault:
          type: boolean
        defaultKey:
          type: ["string", "null"]
        widgets:
          type: array
          items:
            $ref: "#/components/schemas/InsightsWidget"
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InsightsDashboardInput:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        section:
          type: ["string", "null"]
        globalFilters:
          oneOf:
            - $ref: "#/components/schemas/InsightsGlobalFilters"
            - type: "null"
        layout:
          type: array
          items:
            $ref: "#/components/schemas/InsightsLayoutItem"

    InsightsDashboardUpdate:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        section:
          type: ["string", "null"]
        globalFilters:
          oneOf:
            - $ref: "#/components/schemas/InsightsGlobalFilters"
            - type: "null"
        layout:
          type: array
          items:
            $ref: "#/components/schemas/InsightsLayoutItem"
        isShared:
          type: boolean
        sharedUserIds:
          type: array
          items:
            type: integer
        expectedUpdatedAt:
          type: string
          format: date-time
          description: >
            Optimistic-concurrency guard: when present, the update only
            applies if the dashboard's updatedAt still matches; otherwise the
            server answers 409 instead of letting a stale client clobber a
            newer layout (last-write-wins across tabs/devices).

    InsightsDuplicateDashboardInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1

    InsightsDuplicateWidgetInput:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        dashboardId:
          type: ["integer", "null"]

    InsightsQueryRequest:
      type: object
      required: [spec]
      properties:
        spec:
          $ref: "#/components/schemas/InsightsWidgetSpec"
        globalFilters:
          oneOf:
            - $ref: "#/components/schemas/InsightsGlobalFilters"
            - type: "null"

    InsightsQueryBatchRequest:
      type: object
      required: [items]
      properties:
        items:
          type: array
          minItems: 1
          maxItems: 30
          items:
            $ref: "#/components/schemas/InsightsQueryRequest"

    InsightsQueryBatchResult:
      type: object
      required: [results]
      properties:
        results:
          type: array
          description: Aligned to the request's items by index.
          items:
            type: object
            properties:
              result:
                $ref: "#/components/schemas/InsightsQueryResult"
              error:
                type: string

    InsightsQueryResult:
      type: object
      description: >
        Chart results carry xKey + series; table/pivot results carry columns +
        rows. meta always echoes what was actually applied so a number is
        never mysterious.
      required: [meta]
      properties:
        xKey:
          type: string
        series:
          type: array
          items:
            type: object
            required: [key, data]
            properties:
              key:
                type: string
              label:
                type: string
              data:
                type: array
                items:
                  type: object
                  additionalProperties: true
        columns:
          type: array
          items:
            type: object
            required: [key, label, type]
            properties:
              key:
                type: string
              label:
                type: string
              type:
                type: string
        rows:
          type: array
          items:
            type: object
            additionalProperties: true
        meta:
          type: object
          required: [scope, appliedFilters]
          properties:
            scope:
              type: string
            appliedFilters:
              type: object
              properties:
                board:
                  type: array
                  items:
                    type: string
                widget:
                  type: array
                  items:
                    type: string
            freshness:
              type: string
              format: date-time
            totalRows:
              type: integer
            rowCap:
              type: integer
            headline:
              type: object
              description: Report-level headline stat (e.g. the funnel's win rate).
              required: [label, value]
              properties:
                label:
                  type: string
                value:
                  type: number

    InsightsField:
      type: object
      required: [key, label, type, kind, filterable, groupable, measurable]
      properties:
        key:
          type: string
          description: Allow-list key (native key or cf:<registry key>).
        label:
          type: string
        type:
          type: string
          description: varchar|text|double|monetary|date|boolean|enum|set|user|stage|pipeline|status
        kind:
          type: string
          enum: [column, custom]
        filterable:
          type: boolean
        groupable:
          type: boolean
        measurable:
          type: boolean
        options:
          type: array
          items:
            type: object
            required: [value, label]
            properties:
              value:
                type: string
              label:
                type: string

    InsightsFieldList:
      type: object
      required: [scope, fields]
      properties:
        scope:
          type: string
        fields:
          type: array
          items:
            $ref: "#/components/schemas/InsightsField"
