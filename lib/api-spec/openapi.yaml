          oneOf:
            - type: integer
            - type: string
              enum: ["all"]
            - type: "null"
        showDone:
          type: boolean

    UserPreferences:
      type: object
      description: >
        Namespaced per-user preferences document. Every property is optional;
        a user with nothing saved yet gets back an empty object.

        Namespace conventions (no separate schema version field — the shape
        below IS the version, and jsonb storage means every change here is
        additive-safe by construction):
        - Add a new namespace or leaf field as OPTIONAL. Existing documents
          simply lack it until the client writes one; never add `required`.
        - Never change an existing field's meaning or type in place — add a
          new field/namespace instead and leave the old one alone (or have
          the client stop reading it, same as the legacy-localStorage
          migration this replaced). Old stored documents are never rewritten
          on deploy.
        - A `Record<string, T>` namespace (filterPanels/viewModes/tables) is
          keyed by a short semantic surface id (e.g. "deals",
          "dealsActive") chosen once and then stable — renaming a key
          orphans whatever data was stored under the old one.
        - PATCH deep-merges (see UserPreferencesPatch): objects merge
          recursively, arrays/scalars replace, `null` deletes a key. New
          namespaces don't need new endpoints or migrations, just new
          properties here + `pnpm --filter @workspace/api-spec run codegen`.
      properties:
        layout:
          $ref: "#/components/schemas/UserPreferencesLayout"
        filterPanels:
          type: object
          description: Filter-panel collapsed state per surface, e.g. "persons", "organizations".
          additionalProperties:
            type: boolean
        viewModes:
          type: object
          description: Current view mode per surface, e.g. deals "table" | "board".
          additionalProperties:
            type: string
        filters:
          type: object
          description: Saved live filter state per surface, e.g. "deals", "persons".
          additionalProperties:
            $ref: "#/components/schemas/UserPreferencesLooseObject"
        kanbanSorts:
          type: object
          description: Saved kanban/card sort mode per surface.
          additionalProperties:
            $ref: "#/components/schemas/UserPreferencesKanbanSort"
        tables:
          type: object
          description: Column layout per table, e.g. "deals", "persons".
          additionalProperties:
            $ref: "#/components/schemas/TableLayoutPreference"
        deals:
          $ref: "#/components/schemas/UserPreferencesDeals"
        notifications:
          $ref: "#/components/schemas/UserPreferencesNotifications"
        csTasks:
          $ref: "#/components/schemas/UserPreferencesCsTasks"
        recentlyViewed:
          type: array
          maxItems: 15
          description: Most-recently-viewed deal/organization/person records, most recent first.
          items:
            $ref: "#/components/schemas/UserPreferencesRecentlyViewedItem"
        resetEpoch:
          type: integer
          description: >
            Server-managed, read-only. Bumped only by DELETE /user-preferences
            (never by an ordinary PATCH). A PATCH sent with the
            X-Preferences-Reset-Epoch header set to a stale value (i.e. a
            write computed before a reset that has since happened elsewhere)
            is rejected with 409 instead of being applied — see
            UpdateUserPreferences. Not settable via PATCH; any value sent in
            the body is ignored.

    UserPreferencesPatch:
      type: object
      description: >
        Partial update, deep-merged into the stored document: objects merge
        recursively, arrays/scalars replace, and null removes the key (a whole
        namespace, or a single entry of a map like `tables`/`filterPanels`).
      properties:
        layout:
          oneOf:
            - $ref: "#/components/schemas/UserPreferencesLayout"
            - type: "null"
        filterPanels:
          type: object
          additionalProperties:
            oneOf:
              - type: boolean
              - type: "null"
        viewModes:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: "null"
        filters:
          oneOf:
            - type: object
              additionalProperties: true
            - type: "null"
        kanbanSorts:
          type: object
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/UserPreferencesKanbanSort"
              - type: "null"
        tables:
          type: object
          additionalProperties:
            oneOf:
              - $ref: "#/components/schemas/TableLayoutPreference"
              - type: "null"
        deals:
          oneOf:
            - $ref: "#/components/schemas/UserPreferencesDeals"
            - type: "null"
        notifications:
          oneOf:
            - $ref: "#/components/schemas/UserPreferencesNotifications"
            - type: "null"
        csTasks:
          oneOf:
            - $ref: "#/components/schemas/UserPreferencesCsTasks"
            - type: "null"
        recentlyViewed:
          oneOf:
            - type: array
              maxItems: 15
              items:
                $ref: "#/components/schemas/UserPreferencesRecentlyViewedItem"
            - type: "null"

