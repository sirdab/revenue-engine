  /insights/query:
    post:
      operationId: runInsightsQuery
      tags: [insights]
      summary: Run a widget query spec (board filters intersected server-side)
      description: >
        Widgets are pure config: this one generic endpoint executes any widget
        spec, so user-built widgets need no API changes. The spec's field names
        are validated against the per-scope allow-list; board filters compose
        with the spec's own filters by intersection (narrow, never widen).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsQueryRequest"
      responses:
        "200":
          description: Query result
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsQueryResult"
        "400":
          description: Invalid spec (unknown field, bad filters, bad options)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "503":
          description: Analytics is saturated — retry shortly
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /insights/query-batch:
    post:
      operationId: runInsightsQueryBatch
      tags: [insights]
      summary: Run several widget queries in one round trip
      description: >
        One request per board load instead of one per widget. Items succeed or
        fail independently; `results` aligns to `items` by index, each entry
        carrying either `result` or `error`.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/InsightsQueryBatchRequest"
      responses:
        "200":
          description: Per-item results, aligned by index
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsQueryBatchResult"
        "400":
          description: Invalid batch envelope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

  /insights/fields:
    get:
      operationId: listInsightsFields
      tags: [insights]
      summary: Allow-listed fields for a scope (drives builder + filter UIs)
      parameters:
        - name: scope
          in: query
          required: true
          schema:
            type: string
            enum:
              [
                deals,
                activities,
                organizations,
              ]
      responses:
        "200":
          description: Field catalog for the scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/InsightsFieldList"
        "400":
          description: Unknown scope
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"

